<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon Homepage — Week Project</title>
    <link rel="stylesheet" href="assets/css/style.css" />

    <header>

      <div class="nav-bar">
        <div class="logo">
          <a href="index.html">amazon</a>
        </div>
        <input
          type="text"
          name="search"
          id="search"
          placeholder="Cerca prodotti, categorie, brand..."
        />
        <button class="search-btn" type="button">Cerca</button>
        <div class="nav-buttons">
          <button type="button">
            <a href="javascript:void(0)">Account</a>
          </button>
          <button type="button"><a href="javascript:void(0)">Ordini</a></button>
          <button type="button" class="cart">
            <a href="javascript:void(0)">Carrello (0)</a>
          </button>
        </div>
      </div>
    </header>

    <main>
      <table class="table-products"></table>
      <a href="index.html"
        ><button type="button" class="btn-home">Home</button></a
      >
    </main>

    <footer>
      <div class="us">
        <b>Chi siamo</b>
        <ul>
          <li><a href="javascript:void(0)">Lavora con noi</a></li>
          <li><a href="javascript:void(0)">Investitori</a></li>
          <li><a href="javascript:void(0)">Sostenibilità</a></li>
        </ul>
      </div>

      <div class="help">

        <ul>
          <li><a href="javascript:void(0)">Centro assistenza</a></li>
          <li><a href="javascript:void(0)">Spedizioni</a></li>
          <li><a href="javascript:void(0)">Resi e rimborsi</a></li>
        </ul>
      </div>

      <div class="connect">
        <b>Connettiti</b>
        <ul>
          <li><a href="javascript:void(0)">Facebook</a></li>
          <li><a href="javascript:void(0)">Instagram</a></li>
          <li><a href="javascript:void(0)">YouTube</a></li>
        </ul>
      </div>
    </footer>

</html>
